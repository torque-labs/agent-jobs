# Wraps the existing Dockerfile so we can attach to multiple Docker
# networks — Coolify's Dockerfile build pack only supports one. Per
# Coolify docs (https://coolify.io/docs/applications/build-packs/docker-compose)
# declaring an external network here joins this container to it on
# every deploy.
services:
  agent-jobs:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # SERVICE_FQDN_AGENTJOBS_3000 is Coolify's magic var — it
      # auto-injects Traefik labels routing the configured FQDN
      # to this service:port. Without it, Coolify's proxy returns 503.
      - SERVICE_FQDN_AGENTJOBS_3000
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - HERMES_API_URL=${HERMES_API_URL}
      - HERMES_API_TOKEN=${HERMES_API_TOKEN}
      - OUTLINE_BASE_URL=${OUTLINE_BASE_URL}
      - OUTLINE_API_KEY=${OUTLINE_API_KEY}
      - OUTLINE_AGENTS_COLLECTION_ID=${OUTLINE_AGENTS_COLLECTION_ID}
      # Outline-as-a-channel: comment "@agent ..." on a doc -> editor agent edits it.
      - OUTLINE_WEBHOOK_SECRET=${OUTLINE_WEBHOOK_SECRET:-}
      - OUTLINE_EDITOR_AGENT=${OUTLINE_EDITOR_AGENT:-outline-editor}
      - OUTLINE_TRIGGER=${OUTLINE_TRIGGER:-@agent}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - APP_PASSWORD=${APP_PASSWORD}
      # Auth fallback toggle — keep on while Supabase OAuth is being wired.
      - ALLOW_BASIC_AUTH=${ALLOW_BASIC_AUTH:-true}
      # Supabase (Google @torque.so OAuth). Optional — proxy.ts falls back to
      # basic auth when these are empty. See README "Supabase setup".
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - TORQUE_API_KEY=${TORQUE_API_KEY}
      - TORQUE_API_TOKEN=${TORQUE_API_TOKEN}
      - SUPABASE_ACCESS_TOKEN=${SUPABASE_ACCESS_TOKEN}
    expose:
      - "3000"
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  default:
