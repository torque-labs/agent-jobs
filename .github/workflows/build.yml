name: build-image
# Build the agent-jobs image OFF-BOX (GitHub runners) and push to GHCR.
# Coolify then deploys by pulling this image — no on-box `next build`
# (an on-box build OOM-wedged the shared host on 2026-05-26).
on:
  push:
    branches: [main, ci/hermes-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.build
          push: true
          tags: |
            ghcr.io/torque-labs/agent-jobs:latest
            ghcr.io/torque-labs/agent-jobs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
